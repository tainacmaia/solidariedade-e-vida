<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Área Administrativa — Grupo Solidariedade é Vida</title>
  <link rel="stylesheet" href="css/style.css">
</head>
<body>

  <header></header>

  <main>
    <section>
      <div class="container">
        <h2>Área Administrativa</h2>

        <div class="caixa-login" id="caixa-login">
          <h3>Acesso restrito</h3>
          <p class="texto-suave">Área exclusiva da administração do grupo.</p>
          <form id="form-login">
            <label for="usuario">Usuário</label>
            <input type="text" id="usuario" autocomplete="username" required>

            <label for="senha">Senha</label>
            <input type="password" id="senha" autocomplete="current-password" required>

            <button type="submit" class="botao">Entrar</button>
            <div id="feedback-login" class="msg-feedback" role="alert"></div>
          </form>
          <p class="texto-suave" style="margin-top:1rem">
          </p>
        </div>

        <div class="painel-admin" id="painel-admin">
          <p>Bem-vindo(a), administrador(a)!
             <button id="btn-sair" class="botao" style="margin-left:.8rem">Sair</button></p>

          <div class="grade" style="margin-top:1.5rem">
            <div class="cartao">
              <h3>Publicar notícia ou evento</h3>
              <form id="form-noticia">
                <label for="titulo-noticia">Título</label>
                <input type="text" id="titulo-noticia" required>

                <label for="texto-noticia">Texto</label>
                <textarea id="texto-noticia" rows="4" required></textarea>

                <button type="submit" class="botao">Publicar</button>
                <div id="feedback-noticia" class="msg-feedback" role="alert"></div>
              </form>
            </div>

            <div class="cartao">
              <h3>Adicionar prestação de contas</h3>
              <p class="texto-suave">O registro entra no topo da tabela da página Transparência.</p>
              <form id="form-prestacao">
                <label for="periodo">Período</label>
                <input type="text" id="periodo" required placeholder="Ex.: 2º semestre/2026">

                <label for="recebidos">Recursos recebidos</label>
                <input type="text" id="recebidos" required placeholder="Ex.: R$ 9.000,00">

                <label for="aplicados">Recursos aplicados</label>
                <input type="text" id="aplicados" required placeholder="Ex.: R$ 8.700,00">

                <label for="destinacao">Principal destinação</label>
                <input type="text" id="destinacao" required placeholder="Ex.: Cestas básicas">

                <button type="submit" class="botao">Adicionar à tabela</button>
                <div id="feedback-prestacao" class="msg-feedback" role="alert"></div>
              </form>
            </div>
          </div>

          <div style="margin-top:2rem">
            <h3>Mensagens recebidas pelo formulário de contato</h3>
            <ul class="lista-mensagens" id="lista-mensagens"></ul>
          </div>
        </div>

      </div>
    </section>
  </main>

  <footer></footer>

  <script src="js/layout.js"></script>
  <script src="js/main.js"></script>
  <script src="js/admin.js"></script>
</body>
</html>
